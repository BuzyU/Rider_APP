name: Android CI Build & Test

on:
  push:
    branches:
      - main
      - master
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  validate-android:
    name: Android Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permissions for Gradlew
        run: chmod +x mobile-app/gradlew

      - name: Mesh Commit Guard
        run: bash .github/scripts/mesh-commit-guard.sh

      - name: Mesh Invariants
        run: bash .github/scripts/mesh-invariants.sh

      - name: Run Unit Tests
        working-directory: mobile-app
        run: ./gradlew testDebugUnitTest --info

      - name: Enforce Plan Requirements and Unit Test Census
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET, glob, sys, re
          files = glob.glob('mobile-app/app/build/test-results/testDebugUnitTest/*.xml')
          executed_tests = set()
          total, fail, err, skip = 0, 0, 0, 0
          for f in files:
              tree = ET.parse(f).getroot()
              total += int(tree.attrib.get('tests', 0))
              fail += int(tree.attrib.get('failures', 0))
              err += int(tree.attrib.get('errors', 0))
              skip += int(tree.attrib.get('skipped', 0))
              for tc in tree.findall('.//testcase'):
                  classname = tc.attrib.get('classname', '')
                  simple_cls = classname.split('.')[-1]
                  name = tc.attrib.get('name', '')
                  executed_tests.add(f'{simple_cls}#{name}')
                  executed_tests.add(f'{classname}#{name}')
          print(f'Total Tests: {total}, Failures: {fail}, Errors: {err}, Skipped: {skip}')
          if fail > 0 or err > 0:
              sys.exit(1)

          with open('.github/plan-test-matrix.md', 'r') as f:
              matrix = f.read()

          required_tests = re.findall(r'\x60([A-Za-z0-9_]+#[A-Za-z0-9_ ]+)\x60', matrix)
          print(f'Verifying {len(required_tests)} plan requirement test mappings against executed test suite...')
          missing = []
          for req in required_tests:
              if req not in executed_tests:
                  missing.append(req)

          if missing:
              print('ERROR: The following required plan tests from .github/plan-test-matrix.md were not executed:')
              for m in missing:
                  print(f'  - {m}')
              sys.exit(1)

          print(f'SUCCESS: All {len(required_tests)} plan verification tests from sections 1.11, 2.6, and 5 verified passing!')
          "

      - name: Run Android Lint
        working-directory: mobile-app
        run: ./gradlew lintDebug

      - name: Assemble Debug APK
        working-directory: mobile-app
        run: ./gradlew assembleDebug

      - name: Verify Release Assembly With Insecure Keystore
        working-directory: mobile-app
        run: ALLOW_INSECURE_RELEASE_BUILD=true ./gradlew assembleRelease

      - name: Run Release Signing Verification Tests
        run: |
          chmod +x .github/scripts/verify-release-apk.sh
          chmod +x .github/scripts/verify-release-apk.test.sh
          ./.github/scripts/verify-release-apk.test.sh

  validate-backend:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:password@localhost:5432/ridervoice_test' }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL || 'postgresql://postgres:password@localhost:5432/ridervoice_test' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package.json'

      - name: Install Backend Dependencies & Generate Prisma
        working-directory: backend
        run: |
          npm ci
          npx prisma generate

      - name: Validate Backend Syntax
        working-directory: backend
        run: node -c src/server.js

      - name: Lint Backend Code
        working-directory: backend
        run: npm run lint

      - name: Validate Prisma Schema
        working-directory: backend
        run: npx prisma validate

      - name: Run Backend Tests
        working-directory: backend
        run: npm test

  validate-web-app:
    name: Web App Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web-app/package.json'

      - name: Install Web App Dependencies
        working-directory: web-app
        run: npm ci

      - name: Build Web App
        working-directory: web-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
        run: npm run build

