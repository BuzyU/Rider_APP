name: Android CI Build & Test

on:
  push:
    branches:
      - main
      - master
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  validate-android:
    name: Android Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permissions for Gradlew
        run: chmod +x mobile-app/gradlew

      - name: Verify Frozen Online Files Unchanged
        run: |
          FROZEN_PATHS=(
            "mobile-app/app/src/main/java/com/ridervoice/network/LiveKitManager.kt"
            "mobile-app/app/src/main/java/com/ridervoice/network/ConnectionState.kt"
            "mobile-app/app/src/main/java/com/ridervoice/network/NetworkResilienceManager.kt"
            "mobile-app/app/src/main/java/com/ridervoice/state/RoomViewModel.kt"
            "mobile-app/app/src/main/java/com/ridervoice/state/ActiveRideRepository.kt"
            "mobile-app/app/src/main/java/com/ridervoice/state/RoomFault.kt"
            "mobile-app/app/src/main/java/com/ridervoice/state/AppEvents.kt"
            "mobile-app/app/src/main/java/com/ridervoice/services/VoiceForegroundService.kt"
            "mobile-app/app/src/main/java/com/ridervoice/ui/screens/RoomScreen.kt"
            "mobile-app/app/src/main/java/com/ridervoice/ui/screens/room"
            "mobile-app/app/src/main/java/com/ridervoice/audio"
            "mobile-app/app/src/main/java/com/ridervoice/diagnostics"
            "backend"
            "web-app"
            "livekit-server"
          )
          for p in "${FROZEN_PATHS[@]}"; do
            test -e "$p" || { echo "Frozen path missing: $p"; exit 1; }
          done
          git diff --exit-code a37ef09 -- "${FROZEN_PATHS[@]}"

      - name: Run Unit Tests
        working-directory: mobile-app
        run: ./gradlew testDebugUnitTest --info

      - name: Enforce Unit Test Census
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET, glob, sys
          files = glob.glob('mobile-app/app/build/test-results/testDebugUnitTest/*.xml')
          total, fail, err, skip = 0, 0, 0, 0
          for f in files:
              tree = ET.parse(f).getroot()
              total += int(tree.attrib.get('tests', 0))
              fail += int(tree.attrib.get('failures', 0))
              err += int(tree.attrib.get('errors', 0))
              skip += int(tree.attrib.get('skipped', 0))
          print(f'Total Tests: {total}, Failures: {fail}, Errors: {err}, Skipped: {skip}')
          if total < 290 or fail > 0 or err > 0:
              sys.exit(1)
          "

      - name: Run Android Lint
        working-directory: mobile-app
        run: ./gradlew lintDebug

      - name: Assemble Debug APK
        working-directory: mobile-app
        run: ./gradlew assembleDebug

      - name: Verify Release Assembly With Insecure Keystore
        working-directory: mobile-app
        run: ALLOW_INSECURE_RELEASE_BUILD=true ./gradlew assembleRelease

      - name: Run Release Signing Verification Tests
        run: |
          chmod +x .github/scripts/verify-release-apk.sh
          chmod +x .github/scripts/verify-release-apk.test.sh
          ./.github/scripts/verify-release-apk.test.sh

  validate-backend:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:password@localhost:5432/ridervoice_test' }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL || 'postgresql://postgres:password@localhost:5432/ridervoice_test' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package.json'

      - name: Install Backend Dependencies & Generate Prisma
        working-directory: backend
        run: |
          npm ci
          npx prisma generate

      - name: Validate Backend Syntax
        working-directory: backend
        run: node -c src/server.js

      - name: Lint Backend Code
        working-directory: backend
        run: npm run lint

      - name: Validate Prisma Schema
        working-directory: backend
        run: npx prisma validate

      - name: Run Backend Tests
        working-directory: backend
        run: npm test

  validate-web-app:
    name: Web App Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web-app/package.json'

      - name: Install Web App Dependencies
        working-directory: web-app
        run: npm ci

      - name: Build Web App
        working-directory: web-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
        run: npm run build

