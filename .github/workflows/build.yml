name: Android CI Build & Test

on:
  push:
    branches:
      - main
      - master
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master

jobs:
  validate-android:
    name: Android Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Robolectric SDKs
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-m2-${{ runner.os }}-${{ hashFiles('mobile-app/app/build.gradle') }}
          restore-keys: |
            robolectric-m2-${{ runner.os }}-

      - name: Pre-fetch Robolectric SDK Artifacts (With Retry)
        run: |
          BASE_URL="https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented"
          for VER in "8.0.0_r4-robolectric-r1-i4" "11-robolectric-6757853-i4" "13-robolectric-9030017-i4"; do
            DIR="$HOME/.m2/repository/org/robolectric/android-all-instrumented/$VER"
            mkdir -p "$DIR"
            for EXT in "jar" "jar.sha512" "pom" "pom.sha512"; do
              FILE="android-all-instrumented-${VER}.${EXT}"
              if [ ! -s "$DIR/$FILE" ]; then
                echo "Fetching $FILE..."
                curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
                  "${BASE_URL}/${VER}/${FILE}" -o "${DIR}/${FILE}.tmp" && \
                  mv "${DIR}/${FILE}.tmp" "${DIR}/${FILE}" || \
                  echo "Warning: pre-fetch failed for ${FILE}; Robolectric will retry at runtime."
              fi
            done
          done

      - name: Grant Execute Permissions for Gradlew
        run: chmod +x mobile-app/gradlew

      - name: Mesh Commit Guard
        run: bash .github/scripts/mesh-commit-guard.sh

      - name: Mesh Commit Guard Self-Test
        run: bash .github/scripts/mesh-commit-guard.test.sh

      - name: Mesh Invariants
        run: bash .github/scripts/mesh-invariants.sh

      - name: Run Unit Tests
        working-directory: mobile-app
        run: ./gradlew testDebugUnitTest --info

      - name: Enforce Plan Requirements and Unit Test Census
        if: always()
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET, glob, sys, re
          files = glob.glob('mobile-app/app/build/test-results/testDebugUnitTest/*.xml')
          executed_tests = set()
          total, fail, err, skip = 0, 0, 0, 0
          for f in files:
              tree = ET.parse(f).getroot()
              total += int(tree.attrib.get('tests', 0))
              fail += int(tree.attrib.get('failures', 0))
              err += int(tree.attrib.get('errors', 0))
              skip += int(tree.attrib.get('skipped', 0))
              for tc in tree.findall('.//testcase'):
                  classname = tc.attrib.get('classname', '')
                  simple_cls = classname.split('.')[-1]
                  name = tc.attrib.get('name', '')
                  executed_tests.add(f'{simple_cls}#{name}')
                  executed_tests.add(f'{classname}#{name}')
                  for child_tag in ('failure', 'error'):
                      node = tc.find(child_tag)
                      if node is not None:
                          raw_msg = (node.attrib.get('message') or node.text or 'Test failed').strip()
                          first_line = raw_msg.splitlines()[0][:240]
                          print(f'::error title=Unit Test Failed: {simple_cls}#{name}::{first_line}')
                          if node.text:
                              print(f'--- {classname}#{name} ({child_tag}) ---')
                              print(node.text.strip())
          print(f'Total Tests: {total}, Failures: {fail}, Errors: {err}, Skipped: {skip}')
          if fail > 0 or err > 0:
              sys.exit(1)

          with open('.github/plan-test-matrix.md', 'r') as f:
              matrix = f.read()

          ticks = re.findall(r'\x60([^\x60\n]*#[^\x60\n]*)\x60', matrix)
          refs  = [t for t in ticks if re.fullmatch(r'[A-Za-z0-9_]+#[^\x60#]+', t)]
          assert len(refs) == len(ticks), f'unparseable matrix refs: {[t for t in ticks if t not in refs]}'
          missing = [r for r in refs if r not in executed_tests]
          if missing:
              print(f'ERROR: {len(missing)} missing tests from .github/plan-test-matrix.md:')
              for m in missing:
                  print(f'  - {m}')
              sys.exit(1)

          print(f'Verified {len(refs)}/{len(ticks)} mappings')
          print(f'SUCCESS: All {len(refs)} plan verification tests from sections 1.11, 2.6, and 5 verified passing!')
          "

      - name: Run Android Lint
        working-directory: mobile-app
        run: ./gradlew lintDebug

      - name: Assemble Debug APK
        working-directory: mobile-app
        run: ./gradlew assembleDebug

      - name: Verify Release Assembly With Insecure Keystore
        working-directory: mobile-app
        run: ALLOW_INSECURE_RELEASE_BUILD=true ./gradlew assembleRelease verifyReleaseOfflineMeshFlags

      - name: Verify Release APK Offline Mesh Flags (WP-153)
        run: |
          APK_SOURCE="mobile-app/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Generated release APK not found at $APK_SOURCE"
            exit 1
          fi
          DEXDUMP_CMD=""
          if command -v dexdump >/dev/null 2>&1; then
            DEXDUMP_CMD="dexdump"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$BUILD_TOOLS_DIR" ] && [ -x "$BUILD_TOOLS_DIR/dexdump" ]; then
              DEXDUMP_CMD="$BUILD_TOOLS_DIR/dexdump"
            fi
          fi
          if [ -z "$DEXDUMP_CMD" ]; then
            echo "::error::dexdump not found on PATH or in ANDROID_HOME/build-tools."
            exit 1
          fi
          TMP_DEX_DIR="$(mktemp -d)"
          unzip -q -o "$APK_SOURCE" "classes*.dex" -d "$TMP_DEX_DIR"
          python3 - "$TMP_DEX_DIR" "$DEXDUMP_CMD" << 'PYEOF'
          import glob, re, subprocess, sys
          dex_dir, dexdump = sys.argv[1], sys.argv[2]
          dump = ""
          for p in sorted(glob.glob(f"{dex_dir}/classes*.dex")):
              dump += subprocess.check_output([dexdump, "-d", p], text=True, errors="replace")
          # Check BuildConfig fields in DEX; fail if missing, unreadable, or false
          m_mesh = re.search(r"name\s*:\s*'OFFLINE_MESH_BUILD_ENABLED'.{0,200}?(?:value\s*:\s*|=\s*)(true|false)", dump, re.S)
          m_room = re.search(r"name\s*:\s*'PER_ROOM_OFFLINE_CONFIG_ENABLED'.{0,200}?(?:value\s*:\s*|=\s*)(true|false)", dump, re.S)
          print(f"APK DEX BuildConfig inspection: OFFLINE_MESH_BUILD_ENABLED={m_mesh.group(1) if m_mesh else 'MISSING'}, PER_ROOM_OFFLINE_CONFIG_ENABLED={m_room.group(1) if m_room else 'MISSING'}")
          if not m_mesh or not m_room or m_mesh.group(1) != "true" or m_room.group(1) != "true":
              sys.exit("WP-153 FAILED: Release APK DEX missing flags or has OFFLINE_MESH_BUILD_ENABLED/PER_ROOM_OFFLINE_CONFIG_ENABLED != true!")
          PYEOF
          rm -rf "$TMP_DEX_DIR"

      - name: Run Release Signing Verification Tests
        run: |
          chmod +x .github/scripts/verify-release-apk.sh
          chmod +x .github/scripts/verify-release-apk.test.sh
          ./.github/scripts/verify-release-apk.test.sh

  validate-backend:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:password@localhost:5432/ridervoice_test' }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL || 'postgresql://postgres:password@localhost:5432/ridervoice_test' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package.json'

      - name: Install Backend Dependencies & Generate Prisma
        working-directory: backend
        run: |
          npm ci
          npx prisma generate

      - name: Validate Backend Syntax
        working-directory: backend
        run: node -c src/server.js

      - name: Lint Backend Code
        working-directory: backend
        run: npm run lint

      - name: Validate Prisma Schema
        working-directory: backend
        run: npx prisma validate

      - name: Run Backend Tests
        working-directory: backend
        run: npm test

  validate-web-app:
    name: Web App Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web-app/package.json'

      - name: Install Web App Dependencies
        working-directory: web-app
        run: npm ci

      - name: Build Web App
        working-directory: web-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
        run: npm run build

