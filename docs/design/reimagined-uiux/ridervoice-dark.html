<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RiderVoice — Reimagined UI/UX (Obsidian Night · Dark Theme)</title>
<style>
:root {
  --bg-page: #05070A;
  --bg-canvas: #090B0E;
  --bg-surface: #12161C;
  --bg-elevated: #191F27;
  --bg-recessed: #191F27;
  --bg-glass: rgba(18, 22, 28, 0.88);
  --border-hairline: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);
  --ink-primary: #F8FAFC;
  --ink-secondary: #94A3B8;
  --ink-muted: #64748B;
  --accent-primary: #FF6B35;
  --accent-soft: rgba(255, 107, 53, 0.16);
  --voice-active: #14B8A6;
  --voice-soft: rgba(20, 184, 166, 0.16);
  --mesh-accent: #38BDF8;
  --mesh-soft: rgba(56, 189, 248, 0.16);
  --warning-amber: #F59E0B;
  --warning-soft: rgba(245, 158, 11, 0.18);
  --danger-sos: #EF4444;
  --danger-soft: rgba(239, 68, 68, 0.18);
  --shadow-card: 0 10px 28px rgba(0, 0, 0, 0.42);
  --shadow-float: 0 20px 48px rgba(0, 0, 0, 0.65);
  --shimmer-a: #191F27;
  --shimmer-b: #242C37;
  --font-sans: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Inter", "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg-page);
  color: var(--ink-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
body.embedded-frame { background: transparent; }
body.embedded-frame .studio-header { display: none; }

.tabular { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }

/* Top Studio Header */
.studio-header {
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-hairline);
  padding: 12px 20px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.brand-row { display: flex; align-items: center; gap: 10px; }
.brand-badge {
  background: var(--accent-primary);
  color: #090B0E;
  font-weight: 800;
  font-size: 12px;
  padding: 4px 9px;
  border-radius: 8px;
  letter-spacing: 0.04em;
}
.studio-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ctrl-pill {
  border: 1px solid var(--border-hairline);
  background: var(--bg-recessed);
  color: var(--ink-primary);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.16s ease;
}
.ctrl-pill:hover { border-color: var(--accent-primary); }
.ctrl-pill.active {
  background: var(--accent-primary);
  color: #090B0E;
  border-color: var(--accent-primary);
}
.ctrl-select {
  border: 1px solid var(--border-hairline);
  background: var(--bg-surface);
  color: var(--ink-primary);
  padding: 6px 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
}

/* Main Workspace */
.workspace {
  flex: 1;
  display: flex;
  gap: 20px;
  padding: 18px;
  justify-content: center;
  align-items: flex-start;
}
body.embedded-frame .workspace { padding: 6px; }

/* Left Screen Rail */
.screen-rail {
  width: 270px;
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  border-radius: 18px;
  padding: 14px;
  box-shadow: var(--shadow-card);
  max-height: calc(100vh - 96px);
  overflow-y: auto;
}
body.embedded-frame .screen-rail { display: none; }
.rail-section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-muted);
  margin: 10px 0 6px;
}
.rail-btn {
  width: 100%;
  text-align: left;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-secondary);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3px;
}
.rail-btn:hover { background: var(--bg-recessed); color: var(--ink-primary); }
.rail-btn.active {
  background: var(--accent-soft);
  color: var(--accent-primary);
  border-color: rgba(255, 107, 53, 0.34);
  font-weight: 700;
}
.rail-code { font-family: var(--font-mono); font-size: 10px; opacity: 0.75; }

/* Phone Frame (412 x 915 dp scaled cleanly) */
.phone-shell {
  width: 412px;
  height: 868px;
  background: var(--bg-canvas);
  border-radius: 44px;
  border: 10px solid #1E2530;
  box-shadow: var(--shadow-float);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

/* Status Bar */
.status-bar {
  height: 36px;
  padding: 0 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-primary);
  background: var(--bg-canvas);
  z-index: 20;
  flex-shrink: 0;
}
.status-icons { display: flex; gap: 6px; align-items: center; font-size: 11px; }

/* Screen Viewport */
.screen-viewport {
  flex: 1;
  overflow-y: auto;
  padding: 12px 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
}

/* Reusable Minimalist UI Atoms */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.icon-btn {
  min-width: 48px;
  min-height: 48px;
  border-radius: 14px;
  border: 1px solid var(--border-hairline);
  background: var(--bg-surface);
  color: var(--ink-primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-weight: 700;
  font-size: 13px;
  transition: transform 0.14s ease, border-color 0.14s ease;
}
.icon-btn:active { transform: scale(0.96); }
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  border-radius: 20px;
  padding: 16px;
  box-shadow: var(--shadow-card);
}
.card-title { font-size: 16px; font-weight: 700; color: var(--ink-primary); }
.card-sub { font-size: 12.5px; color: var(--ink-secondary); line-height: 1.45; margin-top: 4px; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
}
.badge-voice { background: var(--voice-soft); color: var(--voice-active); }
.badge-mesh { background: var(--mesh-soft); color: var(--mesh-accent); }
.badge-warn { background: var(--warning-soft); color: var(--warning-amber); }
.badge-sos { background: var(--danger-soft); color: var(--danger-sos); }
.badge-neutral { background: var(--bg-recessed); color: var(--ink-secondary); }

.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot-voice { background: var(--voice-active); }
.dot-mesh { background: var(--mesh-accent); }
.dot-warn { background: var(--warning-amber); }
.dot-sos { background: var(--danger-sos); }

/* Glove-First Primary & Secondary Buttons */
.btn-primary {
  width: 100%;
  min-height: 56px;
  border-radius: 16px;
  border: none;
  background: var(--accent-primary);
  color: #090B0E;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 8px 22px rgba(255, 107, 53, 0.28);
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.btn-primary:active { transform: scale(0.975); }
.btn-secondary {
  width: 100%;
  min-height: 48px;
  border-radius: 14px;
  border: 1px solid var(--border-hairline);
  background: var(--bg-recessed);
  color: var(--ink-primary);
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 14px;
}
.btn-danger {
  width: 100%;
  min-height: 52px;
  border-radius: 16px;
  border: 1px solid rgba(239, 68, 68, 0.4);
  background: var(--danger-soft);
  color: var(--danger-sos);
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.input-group { display: flex; flex-direction: column; gap: 6px; }
.input-label { font-size: 12px; font-weight: 700; color: var(--ink-secondary); }
.input-field {
  min-height: 48px;
  border-radius: 14px;
  border: 1px solid var(--border-hairline);
  background: var(--bg-recessed);
  color: var(--ink-primary);
  padding: 0 14px;
  font-size: 14px;
  font-weight: 600;
  width: 100%;
}

.segmented {
  display: flex;
  background: var(--bg-recessed);
  padding: 4px;
  border-radius: 14px;
  gap: 4px;
}
.seg-btn {
  flex: 1;
  min-height: 42px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--ink-secondary);
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
}
.seg-btn.active {
  background: var(--bg-surface);
  color: var(--ink-primary);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* Guarded Hold-to-SOS Bar */
.sos-hold-bar {
  position: relative;
  min-height: 52px;
  border-radius: 16px;
  border: 1px solid rgba(239, 68, 68, 0.38);
  background: var(--danger-soft);
  color: var(--danger-sos);
  font-weight: 800;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  overflow: hidden;
  user-select: none;
}
.sos-hold-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0%;
  background: rgba(239, 68, 68, 0.28);
  transition: width 0.1s linear;
}
.sos-hold-bar.holding .sos-hold-fill {
  width: 100%;
  transition: width 1.1s linear;
}

/* Sculpted 88dp Glove PTT Bar (S09 / S11) */
.ptt-sculpted-bar {
  min-height: 88px;
  border-radius: 24px;
  border: 2px solid var(--accent-primary);
  background: var(--accent-primary);
  color: #090B0E;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  user-select: none;
  box-shadow: 0 12px 30px rgba(255, 107, 53, 0.3);
  transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.18s ease, box-shadow 0.18s ease;
}
.ptt-sculpted-bar.transmitting {
  transform: scale(0.965);
  background: var(--voice-active);
  border-color: var(--voice-active);
  box-shadow: 0 0 0 8px var(--voice-soft);
}
.ptt-sculpted-bar.hw-busy {
  background: var(--warning-amber);
  border-color: var(--warning-amber);
}
.eq-bars { display: flex; align-items: center; gap: 4px; height: 18px; }
.eq-bar {
  width: 4px;
  height: 6px;
  background: currentColor;
  border-radius: 99px;
  transition: height 0.15s ease;
}
.transmitting .eq-bar:nth-child(odd),
.mini-eq .eq-bar:nth-child(odd) {
  animation: eqPulse 0.48s ease-in-out infinite alternate;
}
.transmitting .eq-bar:nth-child(even),
.mini-eq .eq-bar:nth-child(even) {
  animation: eqPulse 0.36s ease-in-out 0.15s infinite alternate;
}
@keyframes eqPulse {
  from { height: 5px; }
  to { height: 18px; }
}

/* Rider Speaking Aura */
.rider-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--bg-recessed);
  color: var(--ink-primary);
  font-weight: 800;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.rider-avatar.speaking {
  border: 2px solid var(--voice-active);
  box-shadow: 0 0 0 6px var(--voice-soft);
}

/* Persistent Floating Live-Ride Mini-Player */
.mini-ride-pill {
  margin: 0 12px 8px;
  padding: 10px 14px;
  border-radius: 18px;
  background: var(--bg-surface);
  border: 1px solid var(--voice-active);
  box-shadow: var(--shadow-float);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  z-index: 25;
}

/* 5-Tab Minimalist Bottom Navigation Bar (Replaces ProfileDrawer) */
.bottom-nav {
  height: 68px;
  background: var(--bg-glass);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--border-hairline);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 6px 8px;
  z-index: 25;
  flex-shrink: 0;
}
.nav-tab {
  border: none;
  background: transparent;
  color: var(--ink-muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 700;
  position: relative;
}
.nav-tab.active {
  color: var(--accent-primary);
  background: var(--accent-soft);
}
.nav-dot {
  position: absolute;
  top: 6px;
  right: 20px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-primary);
}

/* Animation 1: Right-to-Left Motorcycle Sweep & Slipstream Logo Reveal (S01) */
.launch-stage {
  position: relative;
  height: 240px;
  border-radius: 24px;
  background: linear-gradient(135deg, var(--bg-surface), var(--bg-recessed));
  border: 1px solid var(--border-hairline);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.slipstream-line {
  position: absolute;
  top: 52%;
  left: 10%;
  right: 10%;
  height: 3px;
  background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
  transform-origin: right center;
  animation: slipstreamDraw 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.bike-runner {
  position: absolute;
  top: 38%;
  right: -120px;
  width: 96px;
  height: 48px;
  color: var(--accent-primary);
  animation: bikeRightToLeft 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.launch-logo-reveal {
  text-align: center;
  z-index: 2;
  animation: logoRevealClip 1.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes bikeRightToLeft {
  0% { transform: translateX(130px); opacity: 1; }
  85% { opacity: 1; }
  100% { transform: translateX(-540px); opacity: 0; }
}
@keyframes slipstreamDraw {
  0% { transform: scaleX(0); opacity: 0.9; }
  60% { transform: scaleX(1); opacity: 1; }
  100% { transform: scaleX(1); opacity: 0.25; }
}
@keyframes logoRevealClip {
  0%, 25% { clip-path: inset(0 0 0 100%); opacity: 0; transform: translateY(6px); }
  100% { clip-path: inset(0 0 0 0); opacity: 1; transform: translateY(0); }
}

/* Animation 2: Geometry-Matched Skeleton Shimmer Loading */
.skeleton-mode .sk-target {
  position: relative;
  color: transparent !important;
  pointer-events: none;
  overflow: hidden;
  background: var(--shimmer-a) !important;
  border-color: transparent !important;
}
.skeleton-mode .sk-target * { visibility: hidden; }
.skeleton-mode .sk-target::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, var(--shimmer-b), transparent);
  animation: shimmerSweep 1.6s ease-in-out infinite;
}
@keyframes shimmerSweep {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* Reduced Motion Respect */
body.reduced-motion *,
@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Modal / Bottom Sheet Backdrop Inside Phone */
.sheet-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(5px);
  z-index: 40;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.bottom-sheet {
  width: 100%;
  max-height: 82%;
  background: var(--bg-surface);
  border-top: 1px solid var(--border-strong);
  border-radius: 28px 28px 0 0;
  padding: 16px 20px 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 -12px 34px rgba(0, 0, 0, 0.6);
  animation: sheetUp 0.24s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes sheetUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.sheet-handle {
  width: 42px;
  height: 5px;
  background: var(--border-strong);
  border-radius: 99px;
  margin: 0 auto 4px;
}

/* All-Screens Blueprint Grid Mode */
.blueprint-grid {
  display: none;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 16px;
  width: 100%;
  max-width: 1440px;
}
body.grid-mode .phone-shell,
body.grid-mode .screen-rail { display: none; }
body.grid-mode .blueprint-grid { display: grid; }
.bp-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-hairline);
  border-radius: 18px;
  padding: 16px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.bp-chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.bp-chip {
  font-size: 11px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 8px;
  background: var(--bg-recessed);
  color: var(--ink-secondary);
}
</style>
</head>
<body>

<header class="studio-header">
  <div class="brand-row">
    <span class="brand-badge">OBSIDIAN NIGHT · DARK</span>
    <strong>RiderVoice Reimagined UI/UX</strong>
    <span class="badge badge-neutral tabular" id="activeScreenBadge">S04 · Ride Hub</span>
  </div>
  <div class="studio-controls">
    <button class="ctrl-pill active" id="modeSimBtn" onclick="setViewMode('sim')">Phone Simulator</button>
    <button class="ctrl-pill" id="modeGridBtn" onclick="setViewMode('grid')">All 18 Screens + 11 Sheets Grid</button>
    <button class="ctrl-pill" onclick="replayLaunch()">Replay Bike Launch (S01)</button>
    <button class="ctrl-pill" id="skBtn" onclick="toggleSkeleton()">Skeleton Shimmer: OFF</button>
    <button class="ctrl-pill" id="miniBarBtn" onclick="toggleMiniBar()">Mini-Ride Bar: ON</button>
    <select class="ctrl-select" id="transportSelect" onchange="setTransportMode(this.value)" aria-label="Transport Mode">
      <option value="cloud">Transport: Cloud · HD (24ms)</option>
      <option value="switching">Transport: Switching (400ms Guard)…</option>
      <option value="mesh">Transport: Offline Mesh (4/6 · Max 5 Hops)</option>
    </select>
    <select class="ctrl-select" id="modalSelect" onchange="openSheet(this.value)" aria-label="Inspect Modal or Bottom Sheet">
      <option value="">Open Modal / Sheet (M01–M11)…</option>
      <option value="M01">M01 · Quick Join Convoy Sheet</option>
      <option value="M02">M02 · Invite / Add Riders Sheet</option>
      <option value="M03">M03 · Audio Route & Helmet Sheet</option>
      <option value="M04">M04 · Live Connection & Mesh Topology</option>
      <option value="M05">M05 · Leave vs End Convoy Sheet</option>
      <option value="M06">M06 · Offline Mesh Self-Test Sheet</option>
      <option value="M07">M07 · Mapbox Token Configuration</option>
      <option value="M08">M08 · Add Squad Rider Modal</option>
      <option value="M09">M09 · Remove / Sign-Out Confirmation</option>
      <option value="M10">M10 · Edit Rider Profile & Bike</option>
      <option value="M11">M11 · Privacy & 8-State OTA Updater</option>
    </select>
    <button class="ctrl-pill" id="rmBtn" onclick="toggleReducedMotion()">Reduced Motion: OFF</button>
  </div>
</header>

<main class="workspace">
  <aside class="screen-rail" aria-label="Screen and Modal Directory">
    <div class="rail-section-title">Core 5 Bottom-Nav Tabs</div>
    <button class="rail-btn" data-scr="S04" onclick="goScreen('S04')"><span>Tab 1 · Ride Hub</span><span class="rail-code">S04</span></button>
    <button class="rail-btn" data-scr="S13" onclick="goScreen('S13')"><span>Tab 2 · Routes & Radar</span><span class="rail-code">S13</span></button>
    <button class="rail-btn" data-scr="S16" onclick="goScreen('S16')"><span>Tab 3 · Squad & Invites</span><span class="rail-code">S16</span></button>
    <button class="rail-btn" data-scr="S14" onclick="goScreen('S14')"><span>Tab 4 · Activity & Stats</span><span class="rail-code">S14</span></button>
    <button class="rail-btn" data-scr="S18" onclick="goScreen('S18')"><span>Tab 5 · You & Settings</span><span class="rail-code">S18</span></button>

function notifyParent() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type:'RV_SYNC', state: STATE }, '*');
  }
}

window.addEventListener('message', (e) => {
  if (!e.data || e.data.type !== 'RV_COMMAND') return;
  const cmd = e.data;
  if (cmd.screen) STATE.screen = cmd.screen;
  if (cmd.sheet !== undefined) STATE.sheet = cmd.sheet;
  if (cmd.skeleton !== undefined) STATE.skeleton = cmd.skeleton;
  if (cmd.miniBar !== undefined) STATE.miniBar = cmd.miniBar;
  if (cmd.reducedMotion !== undefined) STATE.reducedMotion = cmd.reducedMotion;
  if (cmd.transport) STATE.transport = cmd.transport;
  if (cmd.viewMode) setViewMode(cmd.viewMode, true);
  if (cmd.replayLaunch) { STATE.screen = 'S01'; }
  renderAll(true);
});

function setViewMode(mode, fromParent) {
  document.body.classList.toggle('grid-mode', mode === 'grid');
  document.getElementById('modeSimBtn').classList.toggle('active', mode !== 'grid');
  document.getElementById('modeGridBtn').classList.toggle('active', mode === 'grid');
  if (!fromParent) notifyParent();
}

function goScreen(scr) {
  STATE.screen = scr;
  STATE.sheet = '';
  if (document.body.classList.contains('grid-mode')) setViewMode('sim', true);
  renderAll();
}

function openSheet(id) {
  STATE.sheet = id || '';

}
function closeSheet() {

  STATE.screen = 'S01';

function toggleMiniBar() {

function toggleReducedMotion() {

function setTransportMode(mode) {
  STATE.transport = mode;

}

function toggleGlobalMute() {
  STATE.muted = !STATE.muted;
  renderAll();
}

function attachHoldSos(el) {
  if (!el) return;
  let timer = null;
  const start = () => {
    el.classList.add('holding');
    timer = setTimeout(() => {
      el.classList.remove('holding');
      goScreen('S17');
    }, 850);
  };
  const cancel = () => {
    el.classList.remove('holding');
    if (timer) clearTimeout(timer);
  };
  el.addEventListener('mousedown', start);
  el.addEventListener('touchstart', start);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
  el.addEventListener('touchend', cancel);
}

function renderBlueprintGrid() {
  const grid = document.getElementById('blueprintGrid');
  const screenCards = SCREENS_META.map(s => `
    <div class="bp-card">
      <div class="row-between">
        <span class="badge badge-voice tabular">${s.id}</span>
        <span class="tabular" style="font-size:11px; color:var(--ink-muted);">${s.route}</span>
      </div>
      <div class="card-title" style="font-size:15px;">${s.title}</div>
      <div class="bp-chip-wrap">
        ${s.buttons.map(b => `<span class="bp-chip">${b}</span>`).join('')}
      </div>
      <button class="btn-secondary" style="margin-top:auto; min-height:40px;" onclick="goScreen('${s.id}')">Open ${s.id} in Interactive Simulator →</button>
    </div>
  `).join('');

  const sheetCards = SHEETS_META.map(m => `
    <div class="bp-card">
      <div class="row-between">
        <span class="badge badge-mesh tabular">${m.id}</span>
        <span class="tabular" style="font-size:11px; color:var(--ink-muted);">Modal / Bottom Sheet</span>
      </div>
      <div class="card-title" style="font-size:15px;">${m.title}</div>
      <div class="bp-chip-wrap">
        ${m.buttons.map(b => `<span class="bp-chip">${b}</span>`).join('')}
      </div>
      <button class="btn-secondary" style="margin-top:auto; min-height:40px;" onclick="setViewMode('sim'); openSheet('${m.id}')">Inspect ${m.id} Live →</button>
    </div>
  `).join('');

  grid.innerHTML = screenCards + sheetCards;
}

function renderAll(fromParent) {
  document.body.classList.toggle('skeleton-mode', STATE.skeleton);
  document.body.classList.toggle('reduced-motion', STATE.reducedMotion);

  document.getElementById('skBtn').textContent = `Skeleton Shimmer: ${STATE.skeleton ? 'ON' : 'OFF'}`;
  document.getElementById('skBtn').classList.toggle('active', STATE.skeleton);
  document.getElementById('miniBarBtn').textContent = `Mini-Ride Bar: ${STATE.miniBar ? 'ON' : 'OFF'}`;
  document.getElementById('miniBarBtn').classList.toggle('active', STATE.miniBar);
  document.getElementById('rmBtn').textContent = `Reduced Motion: ${STATE.reducedMotion ? 'ON' : 'OFF'}`;
  document.getElementById('rmBtn').classList.toggle('active', STATE.reducedMotion);
  document.getElementById('transportSelect').value = STATE.transport;

  const meta = SCREENS_META.find(x => x.id === STATE.screen) || SCREENS_META[3];
  document.getElementById('activeScreenBadge').textContent = `${meta.id} · ${meta.title}`;

  document.querySelectorAll('.rail-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.scr === STATE.screen);
  });
  document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.tab === STATE.screen);
  });

  const vp = document.getElementById('screenViewport');
  vp.innerHTML = renderScreenHTML(STATE.screen);
  attachHoldSos(document.getElementById('sosHoldBar'));

  const hideBottomChrome = IMMERSIVE_SCREENS.has(STATE.screen);
  document.getElementById('bottomNav').style.display = hideBottomChrome ? 'none' : 'grid';
  document.getElementById('miniRidePill').style.display = (!hideBottomChrome && STATE.miniBar) ? 'flex' : 'none';
  document.getElementById('miniTransportLabel').textContent =
    STATE.transport === 'mesh' ? 'Offline Mesh · 4/6 · Max 5 Hops' : 'Cloud Intercom · Tap to Expand HUD';
  document.getElementById('miniMuteBtn').textContent = STATE.muted ? '🔇' : '🎙️';

  const backdrop = document.getElementById('sheetBackdrop');
  const content = document.getElementById('sheetContent');
  if (STATE.sheet) {
    backdrop.style.display = 'flex';
    content.innerHTML = renderSheetHTML(STATE.sheet);
  } else {
    backdrop.style.display = 'none';
    content.innerHTML = '';
  }

  if (!fromParent) notifyParent();
}

if (window.location.search.includes('embed=1')) {
  document.body.classList.add('embedded-frame');
}
renderBlueprintGrid();
renderAll(true);
</script>
</body>
