plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.devtools.ksp'
}

kotlin {
    jvmToolchain(17)
}

def calculateVersionCode(String vName) {
    if (project.hasProperty('versionCode')) {
        return project.property('versionCode').toInteger()
    }
    if (System.getenv("VERSION_CODE") != null && !System.getenv("VERSION_CODE").isEmpty()) {
        return System.getenv("VERSION_CODE").toInteger()
    }
    try {
        def clean = vName.replaceAll(/^v/i, "").split(/[-+]/)[0]
        def parts = clean.split(/\./).collect { it.isInteger() ? it.toInteger() : 0 }
        def major = parts.size() > 0 ? parts[0] : 1
        def minor = parts.size() > 1 ? parts[1] : 0
        def patch = parts.size() > 2 ? parts[2] : 0
        def build = parts.size() > 3 ? parts[3] : 0

        // Strict bucket bounds validation to prevent collision
        if (major < 0 || major > 200) {
            throw new GradleException("Invalid major version: $major (must be 0..200)")
        }
        if (minor < 0 || minor > 99) {
            throw new GradleException("Invalid minor version: $minor (must be 0..99 to avoid versionCode collision)")
        }
        if (patch < 0 || patch > 99) {
            throw new GradleException("Invalid patch version: $patch (must be 0..99 to avoid versionCode collision)")
        }
        if (build < 0 || build > 999) {
            throw new GradleException("Invalid build version: $build (must be 0..999)")
        }

        return (major * 10000000) + (minor * 100000) + (patch * 1000) + build
    } catch (GradleException ge) {
        throw ge
    } catch (Exception e) {
        return 1
    }
}

def appVersionName = project.hasProperty('versionName') ? project.property('versionName').toString() : (System.getenv("VERSION_NAME") ?: "0.0.1")
def appVersionCode = calculateVersionCode(appVersionName)

android {
    namespace 'com.ridervoice'
    compileSdk 34

    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE") != null && file(System.getenv("KEYSTORE_FILE")).exists()) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            } else {
                logger.warn("WARNING: Building release APK with debug signing config. This build cannot be updated over builds signed with a production keystore.")
                initWith(signingConfigs.debug)
            }
        }
    }

    defaultConfig {
        applicationId "com.ridervoice"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Required for kapt
    kapt {
        correctErrorTypes true
    }
}

dependencies {
    // Core
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "com.google.android.material:material:1.11.0"

    // Compose
    implementation "androidx.compose.ui:ui:1.5.4"
    implementation "androidx.compose.ui:ui-text-google-fonts:1.5.4"
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation "androidx.navigation:navigation-compose:2.7.6"

    // Firebase Crashlytics (Telemetry & Telemetry)
    implementation platform('com.google.firebase:firebase-bom:32.7.1')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    // Hilt
    implementation "com.google.dagger:hilt-android:2.48"
    kapt "com.google.dagger:hilt-compiler:2.48"
    implementation "androidx.hilt:hilt-navigation-compose:1.1.0"

    // LiveKit
    implementation 'io.livekit:livekit-android:2.25.3'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Encrypted SharedPreferences
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    
    // Firebase BoM & Auth
    implementation platform('com.google.firebase:firebase-bom:32.7.2')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.android.gms:play-services-auth:21.0.0'
    
    // Credential Manager for Google Sign-In
    implementation "androidx.credentials:credentials:1.2.2"
    implementation "androidx.credentials:credentials-play-services-auth:1.2.2"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.0"

    // Mapbox
    implementation "com.mapbox.maps:android:11.2.0"
    implementation "com.mapbox.extension:maps-compose:11.2.0"

    // Location
    implementation "com.google.android.gms:play-services-location:21.1.0"
    
    // Media & AVRCP
    implementation "androidx.media:media:1.7.0"
    
    // Image Loading (Coil for Google Profile Photos & Avatars)
    implementation "io.coil-kt:coil-compose:2.5.0"

    // Room Database (Flight Recorder)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // Unit Testing
    testImplementation "junit:junit:4.13.2"
}
