services:
  - type: web
    name: rider-app-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: DATABASE_URL
        sync: false

      - key: LIVEKIT_URL
        sync: false

      - key: LIVEKIT_API_KEY
        sync: false

      - key: LIVEKIT_API_SECRET
        sync: false

      - key: SMTP_HOST
        sync: false

      - key: SMTP_PORT
        sync: false

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASS
        sync: false

      - key: SMTP_FROM
        sync: false

      - key: SMTP_FROM_NAME
        sync: false

      - key: DIAG_EMAIL_TO
        sync: false

      - key: DIAG_CLOSE_GRACE_SECONDS
        sync: false

      - key: DIAG_ADMIN_KEY
        sync: false
